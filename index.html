<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fejszámolás - Hatványok és Gyökök</title>
    <style>
        :root {
            --bg-color: #f0f4f8; /* Világos kékesszürke */
            --panel-bg: #ffffff; /* Fehér / szürke panel */
            --text-blue: #1d4ed8;
            --text-dark: #1e293b;
            --text-gray: #64748b;
            --btn-blue: #2563eb;
            --btn-blue-hover: #1d4ed8;
            --accent-orange: #d97706;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            background-color: var(--panel-bg);
            padding: 2.5rem;
            border-radius: 14px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.08);
            width: 100%;
            max-width: 650px;
            text-align: center;
            border: 1px solid #e2e8f0;
        }

        h1 { color: var(--text-blue); margin-bottom: 0.5rem; }
        h2 { color: var(--text-gray); font-size: 1.1rem; margin-top: 0; }

        .hidden { display: none !important; }

        .form-group {
            margin-bottom: 1.2rem;
            text-align: left;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            color: var(--text-dark);
            font-size: 0.95rem;
        }

        select, input[type="text"], input[type="number"] {
            width: 100%;
            padding: 0.8rem;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
            background-color: #f8fafc;
            color: var(--text-dark);
        }

        select:focus, input:focus {
            border-color: var(--btn-blue);
            outline: none;
        }

        button {
            padding: 0.9rem 2rem;
            font-size: 1.1rem;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            color: white;
            transition: background-color 0.2s, transform 0.1s;
            margin: 0.4rem;
        }

        button:active { transform: scale(0.98); }

        .btn-start { background-color: var(--btn-blue); width: 100%; }
        .btn-start:hover { background-color: var(--btn-blue-hover); }
        
        .btn-action { background-color: #475569; }
        .btn-action:hover { background-color: #334155; }

        .task-display {
            font-size: 3rem;
            font-weight: bold;
            margin: 1.5rem 0;
            color: var(--text-dark);
            letter-spacing: 2px;
        }

        /* Szép hatványkijelzés stílus */
        .power-base { font-size: 3rem; }
        .power-exp { font-size: 1.8rem; vertical-align: super; }

        .input-answer {
            font-size: 2rem;
            text-align: center;
            width: 180px;
        }

        #feedback-msg {
            font-size: 1.3rem;
            font-weight: bold;
            height: 2rem;
            margin-bottom: 1rem;
        }

        .correct { color: #16a34a; }
        .incorrect { color: #dc2626; }

        .timer-bar-container {
            width: 100%;
            background-color: #e2e8f0;
            height: 8px;
            border-radius: 4px;
            margin-bottom: 1.5rem;
            overflow: hidden;
        }

        .timer-bar {
            width: 100%;
            height: 100%;
            background-color: var(--btn-blue);
            transition: width 0.1s linear;
        }

        .stats-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
            font-size: 0.95rem;
        }
        .stats-table th, .stats-table td {
            border: 1px solid #cbd5e1;
            padding: 0.6rem;
            text-align: center;
        }
        .stats-table th { background-color: #f1f5f9; color: var(--text-dark); }
    </style>
</head>
<body>

<div class="container">
    <!-- BEÁLLÍTÁSI KÉPERNYŐ -->
    <div id="setup-screen">
        <h1>Fejszámolás</h1>
        <h2>Hatványok és gyökvonások gyakorlása</h2>
        
        <div class="form-group">
            <label for="student-name">Diák neve:</label>
            <input type="text" id="student-name" placeholder="Írd be a neved..." autocomplete="off">
        </div>

        <div class="form-group">
            <label for="app-mode">Mód:</label>
            <select id="app-mode">
                <option value="practice">Gyakorlás</option>
                <option value="test">Tesztelés</option>
            </select>
        </div>

        <div class="form-group">
            <label for="topic">Téma:</label>
            <select id="topic">
                <option value="powers">Hatványok (négyzetek és köbök)</option>
                <option value="roots">Gyökvonások (négyzetgyök és köbgyök)</option>
                <option value="mixed">Vegyes (Hatványok és gyökök)</option>
            </select>
        </div>

        <div class="form-group">
            <label for="task-count">Feladatok száma:</label>
            <select id="task-count">
                <option value="6">6 db</option>
                <option value="8" selected>8 db</option>
                <option value="10">10 db</option>
            </select>
        </div>

        <button class="btn-start" onclick="startGame()">Indítás 🚀</button>
    </div>

    <!-- JÁTÉK KÉPERNYŐ -->
    <div id="game-screen" class="hidden">
        <h2 id="progress-indicator">Feladat: 1 / 8</h2>
        <div class="timer-bar-container">
            <div id="timer-bar" class="timer-bar"></div>
        </div>
        <div id="task-container" class="task-display"></div>
        <div>
            <input type="number" id="answer-input" class="input-answer" autocomplete="off" onkeypress="handleEnter(event)">
        </div>
        <div id="feedback-msg"></div>
        <button class="btn-action" onclick="checkAnswer()" id="check-btn">Ellenőrzés</button>
    </div>

    <!-- EREDMÉNY KÉPERNYŐ -->
    <div id="result-screen" class="hidden">
        <h1>Eredmény összesítő</h1>
        <h2 id="final-score"></h2>
        <div id="mistakes-container"></div>
        <br>
        <button class="btn-action" onclick="retryMistakes()" id="retry-btn" style="display:none;">Hibák újrapróbálása</button>
        <button class="btn-start" onclick="location.reload()" style="margin-top: 0.5rem;">Új feladatsor</button>
        <button class="btn-action" onclick="downloadStats()" style="background-color: #0284c7;">Eredmény Letöltése (CSV)</button>
    </div>
</div>

<script>
    const state = {
        name: '',
        mode: 'practice',
        topic: 'powers',
        tasks: [],
        currentTaskIndex: 0,
        score: 0,
        totalPoints: 0,
        mistakes: [],
        taskCount: 8,
        startTime: 0,
        timerInterval: null
    };

    let audioCtx = null;

    function playSound(type) {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);

        if (type === 'correct') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
        } else {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(150, audioCtx.currentTime + 0.3);
            gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    function startGame() {
        state.name = document.getElementById('student-name').value.trim() || 'Névtelen Diák';
        state.mode = document.getElementById('app-mode').value;
        state.topic = document.getElementById('topic').value;
        state.taskCount = parseInt(document.getElementById('task-count').value);

        generateTasks();

        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        document.getElementById('setup-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('hidden');

        state.currentTaskIndex = 0;
        state.score = 0;
        state.totalPoints = 0;
        state.mistakes = [];
        showTask();
    }

    function generateTasks() {
        state.tasks = [];
        let pool = [];

        // Adatbázis építése
        // 1. Els
